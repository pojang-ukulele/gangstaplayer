name: Build & Release Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            builder-flags: "--mac --universal"
          - os: windows-latest
            builder-flags: "--win"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JS build script
        run: node scripts/build.js --prod

      - name: Build and Publish Installer
        run: npx electron-builder ${{ matrix.builder-flags }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}